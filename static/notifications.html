<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>通知 - 校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
        --danger: #ef4444;
        --text-muted: #64748b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        padding: 24px;
        min-height: 100vh;
      }
      .container { max-width: 640px; margin: 0 auto; }
      .header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px; }
      .header h2 { color: #1e293b; }
      .section-title {
        font-size: 15px; font-weight: 600; color: #1e293b;
        display: flex; align-items: center; justify-content: space-between;
        margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
      }
      .section-title .count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
      .btn-sm {
        padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
        cursor: pointer; border: 1px solid var(--border); background: var(--card);
        transition: all .2s;
      }
      .btn-sm-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
      .btn-sm-primary:hover { opacity: .9; }
      .btn-sm-danger { color: var(--danger); border-color: var(--danger); }
      .btn-sm-danger:hover { background: #fef2f2; }
      .btn-sm-muted { color: var(--text-muted); }
      .btn-sm-muted:hover { background: #f1f5f9; }
      .card {
        background: var(--card);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        padding: 16px 20px;
        margin-bottom: 10px;
        transition: opacity .2s;
        cursor: context-menu;
      }
      .card.unread { border-left: 3px solid var(--primary); }
      .card.locked { opacity: .85; }
      .card h3 { font-size: 14px; margin-bottom: 4px; color: #1e293b; }
      .card h3 .lock-icon { font-size: 12px; margin-left: 4px; color: var(--text-muted); }
      .card p { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
      .card .meta { font-size: 12px; color: #94a3b8; }
      .card .row-actions { margin-top: 8px; display: flex; gap: 6px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
      .badge-friend { background: #dbeafe; color: var(--primary); }
      .badge-invite { background: #fef3c7; color: #92400e; }
      .badge-system { background: #dcfce7; color: #166534; }
      .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); }
      .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: #94a3b8; }

      /* Right-click context menu */
      .ctx-menu {
        display: none; position: fixed; background: var(--card); border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15); border: 1px solid var(--border);
        padding: 4px; z-index: 9999; min-width: 140px;
      }
      .ctx-menu.show { display: block; }
      .ctx-menu .item {
        padding: 8px 14px; font-size: 13px; cursor: pointer; border-radius: 6px;
        display: flex; align-items: center; gap: 6px; color: #1e293b;
      }
      .ctx-menu .item:hover { background: #f1f5f9; }
      .ctx-menu .item.danger { color: var(--danger); }
      .ctx-menu .item .hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>🔔 通知中心</h2>
      </div>
      <div id="unreadSection">
        <div class="section-title">
          <span>📌 未读 <span class="count" id="unreadCount"></span></span>
          <button class="btn-sm btn-sm-primary" onclick="markAllRead()">一键已读</button>
        </div>
        <div id="unreadList"><div class="empty-state"><h3>加载中...</h3></div></div>
      </div>
      <div id="readSection">
        <div class="section-title">
          <span>✅ 已读 <span class="count" id="readCount"></span></span>
          <button class="btn-sm btn-sm-danger" onclick="deleteAllRead()">一键删除</button>
        </div>
        <div id="readList"><div class="empty-state"><h3>暂无已读通知</h3></div></div>
      </div>
    </div>

    <!-- Right-click context menu -->
    <div class="ctx-menu" id="ctxMenu">
      <div class="item" id="ctxLock" onclick="ctxToggleLock()">🔒 锁定</div>
      <div class="item danger" id="ctxDelete" onclick="ctxDelete()">🗑️ 删除</div>
    </div>

    <script>
      const token = sessionStorage.getItem("token");
      if (!token) { location.href = "/"; }

      let ctxNotifId = null;

      async function api(url, opt = {}) {
        const headers = { Authorization: token, "Content-Type": "application/json" };
        const res = await fetch(url, { ...opt, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "请求失败");
        return data;
      }

      function getExtra(n) { try { return JSON.parse(n.extra || '{}'); } catch(e) { return {}; } }

      function renderCard(n, isUnread) {
        const markReadBtn = isUnread ? '<div style="text-align:right;margin-top:6px;"><button class="btn-sm btn-sm-muted" onclick="event.stopPropagation();markRead(\'' + n.id + '\', this)">✅ 标记已读</button></div>' : '';
        if (n.type === 'friend_request') {
          const isPending = n.status === 'pending';
          const actions = isPending
            ? '<div class="row-actions">' +
              '<button class="btn-sm btn-sm-primary" onclick="event.stopPropagation();approveFriendRequest(\'' + n.id + '\')">同意</button>' +
              '<button class="btn-sm btn-sm-danger" onclick="event.stopPropagation();rejectFriendRequest(\'' + n.id + '\')">拒绝</button>' +
            '</div>'
            : '<p style="color:var(--text-muted);font-size:12px;margin-top:4px;">✅ 已处理</p>';
          return '<div class="card' + (isUnread ? ' unread' : '') + '" data-id="' + n.id + '" oncontextmenu="showCtx(event,\'' + n.id + '\',false,\'' + n.type + '\')">' +
            '<h3>👤 好友申请 <span class="badge badge-friend">来自 ' + escapeHtml(n.sender_name) + '</span></h3>' +
            (n.content ? '<p>' + escapeHtml(n.content) + '</p>' : '') +
            '<div class="meta">' + new Date(n.created_at * 1000).toLocaleString("zh-CN") + '</div>' +
            actions + markReadBtn + '</div>';
        } else if (n.type === 'chat_invite') {
          const extra = getExtra(n);
          const chatName = extra.chat_name || '';
          const isPending = n.status === 'pending';
          const actions = isPending
            ? '<div class="row-actions">' +
              '<button class="btn-sm btn-sm-primary" onclick="event.stopPropagation();approveChatInvite(\'' + n.id + '\')">同意</button>' +
              '<button class="btn-sm btn-sm-danger" onclick="event.stopPropagation();rejectChatInvite(\'' + n.id + '\')">拒绝</button>' +
            '</div>'
            : '<p style="color:var(--text-muted);font-size:12px;margin-top:4px;">✅ 已处理</p>';
          return '<div class="card' + (isUnread ? ' unread' : '') + '" data-id="' + n.id + '" oncontextmenu="showCtx(event,\'' + n.id + '\',false,\'' + n.type + '\')">' +
            '<h3>💬 聊天室邀请 <span class="badge badge-invite">来自 ' + escapeHtml(n.sender_name) + '</span></h3>' +
            '<p>邀请你加入聊天室「' + escapeHtml(chatName) + '」</p>' +
            '<div class="meta">' + new Date(n.created_at * 1000).toLocaleString("zh-CN") + '</div>' +
            actions + markReadBtn + '</div>';
        } else if (n.type === 'system') {
          const lockCls = n.is_locked ? ' locked' : '';
          const unreadCls = isUnread ? ' unread' : '';
          const lockIcon = n.is_locked ? '<span class="lock-icon">🔒</span>' : '';
          const canDelete = !n.is_locked;
          return '<div class="card' + unreadCls + lockCls + '" data-id="' + n.id + '" oncontextmenu="showCtx(event,\'' + n.id + '\',' + (canDelete ? 'true' : 'false') + ',\'' + n.type + '\',' + (n.is_locked ? 'true' : 'false') + ')">' +
            '<h3>📌 系统通知' + lockIcon + ' <span class="badge badge-system">' + escapeHtml(n.sender_name) + '</span></h3>' +
            '<p>' + escapeHtml(n.content) + '</p>' +
            '<div class="meta">' + new Date(n.created_at * 1000).toLocaleString("zh-CN") + '</div>' +
            markReadBtn + '</div>';
        }
        return '';
      }

      async function loadNotifications() {
        try {
          const notifs = await api("/api/notifications");
          const unread = notifs.filter(n => !n.is_read);
          const read = notifs.filter(n => n.is_read);
          document.getElementById("unreadCount").textContent = '(' + unread.length + ')';
          document.getElementById("readCount").textContent = '(' + read.length + ')';

          const ul = document.getElementById("unreadList");
          if (unread.length === 0) {
            ul.innerHTML = '<div class="empty-state"><h3>📭 没有未读通知</h3></div>';
          } else {
            ul.innerHTML = unread.map(n => renderCard(n, true)).join("");
          }

          const rl = document.getElementById("readList");
          if (read.length === 0) {
            rl.innerHTML = '<div class="empty-state"><h3>暂无已读通知</h3></div>';
          } else {
            rl.innerHTML = read.map(n => renderCard(n, false)).join("");
          }
        } catch (e) {
          document.getElementById("unreadList").innerHTML = '<div class="empty-state"><h3>加载失败</h3><p>' + escapeHtml(e.message) + '</p></div>';
        }
      }

      async function markRead(id, btn) {
        try {
          await api("/api/notifications/read", { method: "POST", body: JSON.stringify({ id }) });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }

      async function markAllRead() {
        try {
          await api("/api/notifications/read-all", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }

      async function deleteAllRead() {
        if (!confirm('确定要删除所有已读通知吗？')) return;
        try {
          await api("/api/notifications/delete-read", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }

      // Right-click context menu
      let ctxNotifType = null;
      let ctxNotifLocked = false;
      function showCtx(event, nid, canDelete, ntype, isLocked) {
        event.preventDefault();
        event.stopPropagation();
        ctxNotifId = nid;
        ctxNotifType = ntype;
        ctxNotifLocked = isLocked;
        const isSys = ntype === 'system';
        document.getElementById("ctxLock").style.display = isSys ? 'flex' : 'none';
        document.getElementById("ctxLock").textContent = isLocked ? '🔓 解锁' : '🔒 锁定';
        document.getElementById("ctxDelete").style.display = canDelete ? 'flex' : 'none';
        const menu = document.getElementById("ctxMenu");
        menu.style.left = event.clientX + 'px';
        menu.style.top = event.clientY + 'px';
        menu.classList.add('show');
      }
      document.addEventListener('click', function() { document.getElementById("ctxMenu").classList.remove('show'); });

      async function ctxDelete() {
        if (!ctxNotifId) return;
        if (!confirm('确定要删除此通知吗？')) return;
        try {
          await api("/api/notifications/delete", { method: "POST", body: JSON.stringify({ id: ctxNotifId }) });
          loadNotifications();
        } catch (e) { alert(e.message); }
        ctxNotifId = null;
      }
      async function ctxToggleLock() {
        if (!ctxNotifId || ctxNotifType !== 'system') return;
        try {
          await api("/api/notifications/lock", { method: "POST", body: JSON.stringify({ id: ctxNotifId, locked: !ctxNotifLocked }) });
          loadNotifications();
        } catch (e) { alert(e.message); }
        ctxNotifId = null;
      }

      async function approveFriendRequest(id) {
        try {
          await api("/api/notifications/" + id + "/approve", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }
      async function rejectFriendRequest(id) {
        try {
          await api("/api/notifications/" + id + "/reject", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }
      async function approveChatInvite(id) {
        try {
          await api("/api/notifications/" + id + "/approve", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }
      async function rejectChatInvite(id) {
        try {
          await api("/api/notifications/" + id + "/reject", { method: "POST" });
          loadNotifications();
        } catch (e) { alert(e.message); }
      }

      function escapeHtml(t) {
        const d = document.createElement("div");
        d.textContent = t;
        return d.innerHTML;
      }

      loadNotifications();
      setInterval(loadNotifications, 5000);
    </script>
  </body>
</html>
