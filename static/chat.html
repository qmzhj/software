<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>私聊 - 校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
        --danger: #ef4444;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        height: 100vh;
        background: var(--bg);
      }
      .sidebar {
        width: 280px;
        background: var(--card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .sidebar-header {
        padding: 20px;
        font-weight: 700;
        border-bottom: 1px solid var(--border);
      }
      .group-tags {
        display: flex;
        flex-wrap: wrap;
        padding: 10px;
        gap: 6px;
      }
      .tag {
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 13px;
        background: white;
      }
      .tag.active {
        background: var(--primary);
        color: white;
      }
      .contact-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .contact-item {
        display: flex;
        align-items: center;
        padding: 12px;
        border-radius: 14px;
        cursor: pointer;
        margin-bottom: 4px;
        transition: 0.2s;
      }
      .contact-item:hover {
        background: #eef2ff;
      }
      .contact-item.active {
        background: #e0e7ff;
        border: 1px solid var(--primary);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        margin-right: 12px;
      }
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--card);
        margin: 10px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .chat-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        display: flex;
        align-items: center;
      }
      .messages {
        flex: 1;
        padding: 20px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f9fafb;
      }
      .bubble {
        max-width: 70%;
        padding: 10px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.5;
        position: relative;
        word-break: break-word;
      }
      .bubble.sent {
        align-self: flex-end;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .bubble.received {
        align-self: flex-start;
        background: #e2e8f0;
        color: #1e293b;
        border-bottom-left-radius: 4px;
      }
      .bubble .time {
        font-size: 10px;
        opacity: 0.7;
        margin-top: 4px;
        text-align: right;
      }
      .bubble .status {
        font-size: 10px;
        margin-left: 4px;
      }
      .bubble.revoked {
        font-style: italic;
        opacity: 0.6;
      }
      .bubble img,
      .bubble video {
        max-width: 200px;
        max-height: 180px;
        border-radius: 12px;
        margin-top: 4px;
      }
      .input-bar {
        display: flex;
        padding: 16px;
        border-top: 1px solid var(--border);
        background: white;
        align-items: center;
        gap: 8px;
      }
      .input-bar input {
        flex: 1;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 24px;
        font-size: 14px;
        outline: none;
      }
      .icon-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
      }
      .icon-btn:hover {
        background: #f1f5f9;
      }
      .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 18px;
        cursor: pointer;
      }
      .call-btns {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .call-btns button {
        border: 1px solid var(--border);
        background: white;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .emoji-panel {
        display: none;
        position: absolute;
        bottom: 80px;
        left: 20px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        width: 320px;
        max-height: 200px;
        overflow-y: auto;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
      }
      .emoji-panel span {
        font-size: 24px;
        cursor: pointer;
        text-align: center;
      }
      .call-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .call-box {
        background: white;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        min-width: 300px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">联系人</div>
      <div class="group-tags" id="privateTags"></div>
      <div class="contact-list" id="contactList"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chatHeader">💬 选择联系人</div>
      <div class="messages" id="msgContainer">
        <div style="text-align: center; color: #64748b; padding: 40px">
          暂无消息
        </div>
      </div>
      <div class="emoji-panel" id="emojiPanel"></div>
      <div class="input-bar">
        <button class="icon-btn" onclick="toggleEmoji()">😊</button>
        <label class="icon-btn" style="cursor: pointer"
          >📎<input
            type="file"
            id="fileInput"
            style="display: none"
            onchange="sendPrivateFile()"
        /></label>
        <input
          id="textInput"
          placeholder="输入消息..."
          disabled
          onkeypress="if (event.key === 'Enter') sendText();"
        />
        <button class="send-btn" onclick="sendText()">➤</button>
        <div class="call-btns">
          <button onclick="startCall('audio')">📞 语音</button>
          <button onclick="startCall('video')">📹 视频</button>
        </div>
      </div>
    </div>
    <div id="callModal" class="call-modal" style="display: none">
      <div class="call-box">
        <h3 id="callStatus">呼叫中...</h3>
        <div style="font-size: 48px; margin: 20px 0" id="callIcon">📞</div>
        <div style="display: flex; gap: 12px; justify-content: center">
          <button
            onclick="endCall()"
            style="
              background: red;
              color: white;
              border: none;
              padding: 10px 20px;
              border-radius: 12px;
            "
          >
            挂断
          </button>
        </div>
      </div>
    </div>
    <script>
      let token = localStorage.getItem("token"),
        currentUid = localStorage.getItem("uid"),
        selectedPeer = null,
        polling,
        filterRole = "all";
      async function api(url, opt = {}) {
        const headers = { ...opt.headers };
        if (token) headers["Authorization"] = token;
        if (!(opt.body instanceof FormData))
          headers["Content-Type"] = "application/json";
        const res = await fetch(url, { ...opt, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "请求失败");
        return data;
      }
      function loadContacts() {
        api("/api/users").then((users) => {
          document.getElementById("privateTags").innerHTML = buildRoleTags();
          const filtered =
            filterRole === "all"
              ? users
              : users.filter((u) => u.role === filterRole);
          document.getElementById("contactList").innerHTML = filtered
            .map(
              (u) =>
                `<div class="contact-item" data-uid="${u.uid}" onclick="selectPeer('${u.uid}','${escapeHtml(u.name)}')"><div class="avatar">${u.name[0]}</div><div style="flex:1"><div style="font-weight:600">${escapeHtml(u.name)}</div><div style="font-size:12px;color:#64748b">${u.role === "student" ? "学生" : "教师"}</div></div></div>`,
            )
            .join("");
        });
      }
      function buildRoleTags() {
        const roles = [
          { key: "all", label: "全部" },
          { key: "student", label: "学生" },
          { key: "teacher", label: "教师" },
        ];
        return roles
          .map(
            (r) =>
              `<span class="tag ${filterRole === r.key ? "active" : ""}" onclick="filterRole='${r.key}';loadContacts()">${r.label}</span>`,
          )
          .join("");
      }
      function selectPeer(uid, name) {
        document
          .querySelectorAll(".contact-item")
          .forEach((el) => el.classList.remove("active"));
        document.querySelector(`[data-uid="${uid}"]`).classList.add("active");
        selectedPeer = uid;
        document.getElementById("chatHeader").innerHTML =
          `💬 与 ${escapeHtml(name)} 聊天中`;
        document.getElementById("textInput").disabled = false;
        loadMessages();
        if (polling) clearInterval(polling);
        polling = setInterval(loadMessages, 2000);
      }
      function loadMessages() {
        if (!selectedPeer) return;
        api(`/api/messages?with=${selectedPeer}`).then((msgs) => {
          const container = document.getElementById("msgContainer");
          container.innerHTML = msgs
            .map((m) => {
              const isMe = m.sender === currentUid,
                cls = isMe ? "sent" : "received";
              let content = "";
              if (m.revoked) {
                content = '<div class="revoked">消息已被撤回</div>';
              } else if (m.msg_type === "image") {
                content = `<img src="${m.file_path}">`;
              } else if (m.msg_type === "video") {
                content = `<video controls src="${m.file_path}"></video>`;
              } else if (m.msg_type === "audio") {
                content = `<audio controls src="${m.file_path}"></audio>`;
              } else if (m.msg_type === "file") {
                content = `<a href="${m.file_path}" download="${m.file_name}">📎 ${m.file_name}</a>`;
              } else {
                content = escapeHtml(m.content);
              }
              const time = new Date(m.timestamp * 1000).toLocaleTimeString(
                "zh-CN",
                { hour: "2-digit", minute: "2-digit" },
              );
              const statusIcon = isMe ? (m.status === "read" ? "✓✓" : "✓") : "";
              const revokeBtn =
                isMe && !m.revoked && Date.now() / 1000 - m.timestamp < 120
                  ? `<button onclick="revoke(${m.id})" style="font-size:10px;">撤回</button>`
                  : "";
              return `<div class="bubble ${cls}"><div>${content}</div><div class="time">${time} ${statusIcon} ${revokeBtn}</div></div>`;
            })
            .join("");
          container.scrollTop = container.scrollHeight;
        });
      }
      function sendText() {
        const input = document.getElementById("textInput");
        const text = input.value.trim();
        if (!text || !selectedPeer) return;
        api("/api/send", {
          method: "POST",
          body: JSON.stringify({ receiver: selectedPeer, content: text }),
        }).then(() => {
          input.value = "";
          loadMessages();
        });
      }
      function sendPrivateFile() {
        const file = document.getElementById("fileInput").files[0];
        if (!file || !selectedPeer) return;
        const form = new FormData();
        form.append("receiver", selectedPeer);
        form.append("file", file);
        form.append(
          "msg_type",
          file.type.startsWith("image/")
            ? "image"
            : file.type.startsWith("video/")
              ? "video"
              : file.type.startsWith("audio/")
                ? "audio"
                : "file",
        );
        fetch("/api/send", {
          method: "POST",
          headers: { Authorization: token },
          body: form,
        })
          .then((r) => r.json())
          .then(() => loadMessages());
      }
      function revoke(id) {
        api(`/api/messages/revoke/${id}`, { method: "POST" }).then(() =>
          loadMessages(),
        );
      }
      function toggleEmoji() {
        const panel = document.getElementById("emojiPanel");
        if (panel.style.display === "grid") {
          panel.style.display = "none";
          return;
        }
        const emojis =
          "😀😂🤣😃😄😅😆😉😊😋😎😍😘🥰😗😙😚🤗🤩🤔🤨😐😑😶🙄😏😣😥😮🤐😯😪😫😴😌😛😜😝🤤😒😓😔😕🙃🤑😲☹️🙁😖😞😟😤😢😭😦😧😨😩🤯😬😰😱🥵🥶😳🤪😵😡😠🤬😷🤒🤕🤢🤮😇🤠🤡🤥🥳🥴🥺🤯🤗".split(
            "",
          );
        panel.innerHTML = emojis
          .map(
            (e) =>
              `<span onclick="document.getElementById('textInput').value+='${e}'">${e}</span>`,
          )
          .join("");
        panel.style.display = "grid";
      }
      function startCall(type) {
        document.getElementById("callModal").style.display = "flex";
        document.getElementById("callIcon").innerHTML =
          type === "video" ? "📹" : "📞";
        document.getElementById("callStatus").innerText = "呼叫中...";
        setTimeout(() => {
          document.getElementById("callStatus").innerText = "通话中 00:01";
        }, 2000);
      }
      function endCall() {
        document.getElementById("callModal").style.display = "none";
      }
      function escapeHtml(t) {
        const d = document.createElement("div");
        d.textContent = t;
        return d.innerHTML;
      }
      window.onload = function () {
        if (!localStorage.getItem("token")) {
          location.href = "/";
          return;
        }
        loadContacts();
      };
    </script>
  </body>
</html>
