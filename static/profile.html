<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>个人设置 - 校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        width: 420px;
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px 32px;
      }
      .card h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #1e293b;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        background: #f8fafc;
      }
      .form-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .error {
        color: #ef4444;
        font-size: 13px;
        margin-top: 6px;
      }
      .role-info {
        background: #f1f5f9;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>👤 个人设置</h2>
      <div class="role-info">
        当前角色：<strong id="roleDisplay"></strong>（学号/工号：<span
          id="uidDisplay"
        ></span
        >）
      </div>
      <div class="form-group">
        <label>姓名</label><input id="nameInput" placeholder="修改姓名" />
      </div>
      <div class="form-group">
        <label>新密码（留空则不修改）</label
        ><input
          type="password"
          id="pwdInput"
          placeholder="至少8位含大小写字母和数字"
        />
      </div>
      <button class="btn" onclick="saveProfile()">保存修改</button>
      <div class="error" id="errorMsg"></div>
    </div>
    <script>
      let token = localStorage.getItem("token"),
        currentUid = localStorage.getItem("uid"),
        currentRole = localStorage.getItem("role");
      document.getElementById("roleDisplay").innerText =
        currentRole === "student" ? "学生" : "教职工";
      document.getElementById("uidDisplay").innerText = currentUid;
      async function saveProfile() {
        const name = document.getElementById("nameInput").value.trim();
        const pwd = document.getElementById("pwdInput").value.trim();
        if (!name) {
          document.getElementById("errorMsg").innerText = "姓名不能为空";
          return;
        }
        try {
          const res = await fetch("/api/userinfo", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: token,
            },
            body: JSON.stringify({ name, password: pwd || undefined }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          localStorage.setItem("name", name);
          alert("修改成功");
          document.getElementById("pwdInput").value = "";
        } catch (e) {
          document.getElementById("errorMsg").innerText = e.message;
        }
      }
    </script>
  </body>
</html>
