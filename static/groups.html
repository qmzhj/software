<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>群组 - 校园通</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f1f5f9;
      --card: #fff;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      height: 100vh;
      background: var(--bg);
    }
    .sidebar {
      width: 300px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px 18px;
      font-weight: 700;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .sidebar-header .back-btn {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .group-list, .detail-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .group-item, .member-item, .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: 0.15s;
    }
    .group-item:hover, .member-item:hover, .chat-item:hover {
      background: #eef2ff;
    }
    .group-item.active, .member-item.active, .chat-item.active {
      background: #e0e7ff;
      border: 1px solid var(--primary);
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; margin-right: 12px; flex-shrink: 0;
      color: white; font-size: 16px;
    }
    .avatar-group { background: linear-gradient(135deg, #10b981, #34d399); }
    .avatar-user { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .avatar-chat { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .item-sub {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-count {
      font-size: 11px; color: var(--text-muted);
      background: var(--bg); padding: 2px 8px; border-radius: 10px;
    }
    .detail-section {
      padding: 6px 0;
    }
    .detail-section-title {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      padding: 8px 12px 4px; text-transform: uppercase;
    }
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      background: var(--card); margin: 10px; border-radius: 20px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .chat-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      font-weight: 600; display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header .detail-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--text);
      font-weight: 500;
    }
    .chat-header .detail-btn:hover { background: #eef2ff; }
    .messages {
      flex: 1; padding: 20px 24px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
      background: #f9fafb;
    }
    .bubble {
      max-width: 70%; padding: 10px 16px; border-radius: 18px;
      font-size: 14px; line-height: 1.5; word-break: break-word;
    }
    .bubble.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; border-bottom-right-radius: 4px;
    }
    .bubble.received {
      align-self: flex-start;
      background: #e2e8f0; color: #1e293b; border-bottom-left-radius: 4px;
    }
    .sender-name { font-weight: 600; margin-bottom: 4px; color: var(--primary); font-size: 13px; }
    .bubble .time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .input-bar {
      display: flex; padding: 16px; border-top: 1px solid var(--border);
      background: white; align-items: center; gap: 8px;
    }
    .input-bar input {
      flex: 1; padding: 10px 16px; border: 1px solid var(--border);
      border-radius: 24px; font-size: 14px; outline: none;
    }
    .input-bar input:focus { border-color: var(--primary); }
    .send-btn {
      background: var(--primary); color: white; border: none;
      border-radius: 50%; width: 36px; height: 36px;
      font-size: 18px; cursor: pointer;
    }
    .empty-state {
      text-align: center; color: var(--text-muted); padding: 60px 20px;
    }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }
    .toolbar {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .toolbar button {
      padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: white; font-size: 12px; cursor: pointer; color: var(--text);
    }
    .toolbar button:hover { background: #eef2ff; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 16px; padding: 24px;
      width: 420px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 16px; }
    .modal input, .modal select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; margin-bottom: 10px;
    }
    .modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .modal .btn-row button {
      padding: 8px 20px; border-radius: 10px; border: none;
      font-size: 14px; cursor: pointer;
    }
    .modal .btn-primary { background: var(--primary); color: white; }
    .modal .btn-cancel { background: var(--bg); color: var(--text); }
    .modal .member-list-add {
      max-height: 200px; overflow-y: auto; border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 10px;
    }
    .modal .member-list-add label {
      display: flex; align-items: center; padding: 6px 10px;
      font-size: 13px; cursor: pointer;
    }
    .modal .member-list-add label:hover { background: #f1f5f9; }
    .modal .member-list-add input { width: auto; margin: 0 8px 0 0; }
    .friend-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 20px; font-size: 12px;
      border: 1px solid var(--border); cursor: pointer; margin: 2px;
    }
    .friend-tag.is-friend { background: #dbeafe; border-color: var(--primary); color: var(--primary); }
    .system-badge {
      font-size: 11px; background: #e0e7ff; color: var(--primary);
      padding: 1px 8px; border-radius: 8px; margin-left: 6px;
    }
    .multi-cb { width:16px;height:16px;margin:0 6px 0 2px;flex-shrink:0;cursor:pointer; }
    .member-item, .chat-item { display:flex;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer; }
    .member-item:hover, .chat-item:hover { background:#f8fafc; }
    .add-section-title { font-size:13px;font-weight:600;color:#475569;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px; }
    .ctx-menu {
      position:fixed; background:var(--card); border:1px solid var(--border);
      border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12);
      padding:4px; z-index:2000; min-width:140px; display:none;
    }
    .ctx-menu .ctx-item {
      padding:8px 14px; font-size:13px; cursor:pointer; border-radius:8px;
      display:flex; align-items:center; gap:6px;
    }
    .ctx-menu .ctx-item:hover { background:#f1f5f9; }
    .ctx-menu .ctx-item.danger { color:var(--danger); }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarHeader">
      <span id="sidebarTitle">📁 我的群组</span>
      <span id="sidebarActions">
        <button onclick="showCreateGroupModal()">+ 新建</button>
      </span>
    </div>
    <div class="toolbar" id="detailToolbar" style="display:none">
      <button onclick="showAddItemModal()">+ 添加聊天</button>
      <button onclick="showCreateChatModal()">+ 创建聊天室</button>
      <button id="multiSelectToggle" onclick="toggleMultiSelect()">☐ 多选</button>
    </div>
    <div class="group-list" id="groupList"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">👥 选择一个群组</div>
    <div id="announcementBanner" style="display:none;padding:8px 16px;background:#fef3c7;border-bottom:1px solid #f59e0b;font-size:13px;color:#92400e;flex-shrink:0;align-items:center;justify-content:space-between;">
      <span id="announcementBannerText" style="flex:1;"></span>
      <button onclick="dismissAnnouncement()" style="background:none;border:none;font-size:16px;cursor:pointer;color:#92400e;padding:0 4px;">×</button>
    </div>
    <div class="messages" id="msgContainer">
      <div class="empty-state" id="emptyState">
        <h3>📁 群组管理</h3>
        <p>左侧选择群组查看成员和聊天室</p>
        <p style="margin-top:12px;font-size:12px;">
          系统默认创建「即时聊天」和「私聊」群组<br>
          可自行创建和管理自定义群组
        </p>
      </div>
    </div>
    <div class="input-bar" id="inputBar" style="display:none">
      <input id="textInput" placeholder="输入消息..." disabled
             onkeypress="if (event.key === 'Enter') sendCurrentMessage();" />
      <button class="send-btn" onclick="sendCurrentMessage()">➤</button>
    </div>
  </div>

  <!-- Modal: Create Group -->
  <div class="modal-overlay" id="createGroupModal">
    <div class="modal">
      <h3>📁 新建群组</h3>
      <input id="newGroupName" placeholder="群组名称" />
      <select id="newGroupCategory">
        <option value="自定义">自定义</option>
        <option value="课程">课程</option>
        <option value="比赛">比赛</option>
        <option value="班级">班级</option>
        <option value="年级">年级</option>
        <option value="学院">学院</option>
        <option value="办公">办公</option>
      </select>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">选择成员（可选）:</p>
      <div class="member-list-add" id="newGroupMembers"></div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:6px;margin-top:8px;">选择聊天室（可选）:</p>
      <div class="member-list-add" id="newGroupChats"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('createGroupModal')">取消</button>
        <button class="btn-primary" onclick="createGroup()">创建</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add Chat (unified: members + chat rooms) -->
  <div class="modal-overlay" id="addItemModal">
    <div class="modal" style="width:440px;">
      <h3>📥 添加聊天</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">选择要添加到本群组的联系人和聊天室</p>
      <div id="addItemList" style="max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin-bottom:10px;"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('addItemModal')">取消</button>
        <button class="btn-primary" onclick="addItemsToGroup()">添加</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Chat Room -->
  <div class="modal-overlay" id="createChatModal">
    <div class="modal">
      <h3>💬 创建聊天室</h3>
      <input id="newChatName" placeholder="聊天室名称" />
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">选择成员（可选，范围为所有用户）:</p>
      <div class="member-list-add" id="newChatMembers"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('createChatModal')">取消</button>
        <button class="btn-primary" onclick="createChatInGroup()">创建</button>
      </div>
    </div>
  </div>

  <!-- Modal: Chat Room Detail -->
  <div class="modal-overlay" id="chatDetailModal">
    <div class="modal" style="width:480px;">
      <h3>💬 聊天室详情</h3>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:15px;font-weight:600;" id="chatDetailName"></span>
        <span id="chatDetailAdminActions" style="display:none;">
          <button class="btn-cancel" style="font-size:12px;padding:2px 8px;" onclick="showRenameChat()">✏️ 重命名</button>
          <button class="btn-cancel" style="font-size:12px;padding:2px 8px;" onclick="showPostAnnouncement()">📢 公告</button>
        </span>
      </div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;" id="chatDetailMeta"></p>

      <div class="detail-section-title" style="display:flex;justify-content:space-between;">
        <span>👥 成员</span>
        <span>
          <button class="btn-cancel" style="font-size:12px;padding:1px 8px;" onclick="showInviteToChat()">+ 邀请</button>
        </span>
      </div>
      <div id="chatDetailMembers" style="margin-bottom:12px;max-height:250px;overflow-y:auto;"></div>

      <div class="btn-row" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;">
        <div>
          <button class="btn-cancel" style="color:var(--danger);border:1px solid var(--danger);" onclick="leaveChatRoom()">退出聊天室</button>
          <button class="btn-cancel" id="dissolveChatBtn" style="color:var(--danger);border:1px solid var(--danger);margin-left:6px;display:none;" onclick="dissolveChatRoom()">解散聊天室</button>
        </div>
        <button class="btn-cancel" onclick="closeModal('chatDetailModal')">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal: Invite to Chat -->
  <div class="modal-overlay" id="inviteChatModal">
    <div class="modal">
      <h3>👤 邀请成员</h3>
      <div class="member-list-add" id="inviteChatMemberList"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('inviteChatModal')">取消</button>
        <button class="btn-primary" onclick="inviteToChat()">邀请</button>
      </div>
    </div>
  </div>

  <!-- Modal: Rename Chat -->
  <div class="modal-overlay" id="renameChatModal">
    <div class="modal">
      <h3>✏️ 修改聊天室名称</h3>
      <input id="renameChatInput" placeholder="新名称" />
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('renameChatModal')">取消</button>
        <button class="btn-primary" onclick="renameChat()">确认</button>
      </div>
    </div>
  </div>

  <!-- Modal: Post Announcement -->
  <div class="modal-overlay" id="announcementModal">
    <div class="modal">
      <h3>📢 发布公告</h3>
      <textarea id="announcementInput" placeholder="请输入公告内容" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;min-height:80px;resize:vertical;font-family:inherit;"></textarea>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('announcementModal')">取消</button>
        <button class="btn-primary" onclick="postAnnouncement()">发布</button>
      </div>
    </div>
  </div>

  <!-- Modal: Member Info -->
  <div class="modal-overlay" id="memberInfoModal">
    <div class="modal" style="width:380px;">
      <h3>👤 用户信息</h3>
      <div style="text-align:center;padding:16px 0;">
        <div class="avatar avatar-user" id="memberInfoAvatar" style="width:64px;height:64px;font-size:28px;margin:0 auto 12px;"></div>
        <p style="font-size:18px;font-weight:600;" id="memberInfoName"></p>
        <p style="font-size:14px;color:var(--text-muted);" id="memberInfoUid"></p>
        <p style="font-size:14px;color:var(--text-muted);" id="memberInfoRole"></p>
        <p style="font-size:14px;color:#475569;margin-top:12px;padding:8px 16px;background:#f1f5f9;border-radius:8px;" id="memberInfoDesc">暂无简介</p>
      </div>
      <div class="btn-row" style="justify-content:center;gap:12px;">
        <button class="btn-primary" id="memberInfoChatBtn" onclick="memberInfoStartChat()">💬 聊天</button>
        <button class="btn-cancel" id="memberInfoBlockBtn" style="color:var(--danger);border:1px solid var(--danger);" onclick="memberInfoToggleBlock()">拉黑</button>
        <button class="btn-cancel" id="memberInfoFriendBtn" style="display:none;" onclick="memberInfoToggleFriend()"></button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn-cancel" style="width:100%;" onclick="closeModal('memberInfoModal')">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal: Send Friend Request -->
  <div class="modal-overlay" id="friendRequestModal">
    <div class="modal" style="width:360px;">
      <h3>🤍 加好友</h3>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:12px;">发送好友申请给 <strong id="friendReqTargetName"></strong></p>
      <textarea id="friendReqMessage" placeholder="添加好友备注..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;min-height:80px;resize:vertical;font-family:inherit;"></textarea>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('friendRequestModal')">取消</button>
        <button class="btn-primary" onclick="sendFriendRequest()">发送申请</button>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" id="ctxDetail" onclick="ctxHandleDetail()">📋 详情</div>
    <div class="ctx-item danger" id="ctxRemove" onclick="ctxHandleRemove()">🚪 移出本群组</div>
  </div>

  <!-- Modal: Popup Private Chat -->
  <div class="modal-overlay" id="popupChatModal">
    <div class="modal" style="width:480px;height:560px;display:flex;flex-direction:column;padding:0;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <span style="font-weight:600;font-size:16px;" id="popupChatTitle">💬 私聊</span>
        <button class="btn-cancel" style="padding:4px 12px;font-size:13px;" onclick="closePopupChat()">✕ 返回</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 16px;" id="popupChatMessages"></div>
      <div style="display:flex;padding:12px 16px;border-top:1px solid var(--border);gap:8px;flex-shrink:0;">
        <input id="popupChatInput" style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendPopupChatMsg()" />
        <button class="btn-primary" style="padding:10px 20px;border-radius:8px;" onclick="sendPopupChatMsg()">发送</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const currentUid = localStorage.getItem("uid");

    // State
    let viewState = "groups"; // "groups" | "group-detail"
    let selectedGroup = null;     // current group object
    let selectedMember = null;    // current member for private chat
    let selectedChat = null;     // current chat room for group chat
    let polling = null;
    let allUsers = [];
    let multiSelectMode = false;

    // Context menu state
    let ctxTarget = null; // { type: 'member'|'chat', uid/chatId, name }

    // ---------- Context Menu ----------
    function showContextMenu(e, type, id, name) {
      e.preventDefault();
      ctxTarget = { type, id, name };
      const menu = document.getElementById("ctxMenu");
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
      menu.style.display = 'block';
    }

    function hideContextMenu() {
      document.getElementById("ctxMenu").style.display = 'none';
      ctxTarget = null;
    }

    function ctxHandleDetail() {
      const t = ctxTarget;
      hideContextMenu();
      if (!t) return;
      if (t.type === 'member') {
        const el = { dataset: { uid: t.id, name: t.name, role: '' } };
        if (selectedGroup) {
          const member = selectedGroup.members.find(m => m.uid === t.id);
          if (member) el.dataset.role = member.role || '';
        }
        showMemberInfo(el);
      } else if (t.type === 'chat') {
        if (!currentChatRoom || currentChatRoom !== t.id) {
          enterChatRoom(t.id, t.name, null);
        }
        showChatDetail();
      }
    }

    async function ctxHandleRemove() {
      const t = ctxTarget;
      hideContextMenu();
      if (!t || !selectedGroup) return;
      if (!confirm('确认将"' + t.name + '"移出本群组？')) return;
      try {
        const payload = {};
        if (t.type === 'member') payload.member_uids = [t.id];
        else if (t.type === 'chat') payload.chat_ids = [t.id];
        await api("/api/user-groups/" + selectedGroup.group_id + "/batch-remove", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    // Hide context menu on any click
    document.addEventListener('click', function(e) {
      const menu = document.getElementById("ctxMenu");
      if (menu.style.display === 'block' && !menu.contains(e.target)) {
        hideContextMenu();
      }
    });

    // ---------- API helper ----------
    async function api(url, opt = {}) {
      const headers = { ...opt.headers };
      if (token) headers["Authorization"] = token;
      if (!(opt.body instanceof FormData)) headers["Content-Type"] = "application/json";
      const res = await fetch(url, { ...opt, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }

    // ---------- Modal helpers ----------
    function showModal(id) { document.getElementById(id).classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    // ---------- Group Level 1: List all groups ----------
    async function loadGroups() {
      try {
        const groups = await api("/api/user-groups");
        const list = document.getElementById("groupList");
        list.innerHTML = groups.map(g => `
          <div class="group-item" data-gid="${g.group_id}" onclick="enterGroup('${g.group_id}', this)">
            <div class="avatar avatar-group">📁</div>
            <div class="item-info">
              <div class="item-name">
                ${escapeHtml(g.name)}
                ${g.group_type === 'system' ? '<span class="system-badge">系统</span>' : ''}
              </div>
              <div class="item-sub">
                ${escapeHtml(g.category)} · ${g.member_count_except_self} 个成员 · ${g.chat_count} 个聊天室
              </div>
            </div>
          </div>
        `).join("");
        if (groups.length === 0) {
          list.innerHTML = '<div class="empty-state"><p>暂无群组，点击「新建」创建</p></div>';
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ---------- Group Level 2: Enter group detail ----------
    async function enterGroup(groupId, el) {
      try {
        document.querySelectorAll('.group-item').forEach(i => i.classList.remove('active'));
        if (el) el.classList.add('active');
        const detail = await api(`/api/user-groups/${groupId}/detail`);
        selectedGroup = detail;
        selectedMember = null;
        selectedChat = null;
        viewState = "group-detail";
        renderGroupDetail(detail);
        showGroupDetailView(detail);
      } catch (e) {
        console.error(e);
      }
    }

    function renderGroupDetail(detail) {
      const list = document.getElementById("groupList");
      const multi = multiSelectMode;
      let html = '<div class="detail-section">';

      if (multi) {
        html += '<div style="padding:8px 4px;display:flex;gap:6px;flex-wrap:wrap;">'
          + '<button class="btn-cancel" style="font-size:12px;padding:4px 10px;" onclick="toggleSelectAllMembers(true)">全选成员</button>'
          + '<button class="btn-cancel" style="font-size:12px;padding:4px 10px;" onclick="toggleSelectAllChats(true)">全选聊天室</button>'
          + '<button class="btn-primary" style="font-size:12px;padding:4px 10px;background:var(--danger);border-color:var(--danger);" id="removeSelectedBtn" disabled onclick="removeSelectedItems()">移出</button>'
          + '<button class="btn-cancel" style="font-size:12px;padding:4px 10px;" onclick="toggleMultiSelect()">取消</button>'
          + '</div>';
      }

      // Members section
      html += '<div class="detail-section-title">👤 成员 (' + detail.members.length + ')</div>';
      detail.members.forEach(m => {
        const isMe = m.uid === currentUid;
        html += `
          <div class="member-item" data-uid="${m.uid}" data-name="${escapeHtml(m.name)}" ${multi ? '' : 'onclick="startPrivateChat(\'' + m.uid + '\',\'' + escapeHtml(m.name) + '\', this)" oncontextmenu="showContextMenu(event,\'member\',\'' + m.uid + '\',\'' + escapeHtml(m.name) + '\')"'}>
            ${multi ? '<input type="checkbox" class="multi-cb member-cb" value="' + m.uid + '" onchange="updateRemoveBtn()" ' + (isMe ? 'disabled' : '') + ' />' : ''}
            <div class="avatar avatar-user">${escapeHtml(m.name.charAt(0))}</div>
            <div class="item-info" style="cursor:${isMe ? 'default' : 'pointer'}">
              <div class="item-name">
                ${escapeHtml(m.name)} (${m.uid})
                ${isMe ? '<span style="font-size:11px;color:var(--text-muted);margin-left:4px">(我)</span>' : ''}
              </div>
              <div class="item-sub">${m.role}</div>
            </div>
          </div>
        `;
      });

      // Chats section
      html += '<div class="detail-section-title">💬 聊天室 (' + detail.chats.length + ')</div>';
      detail.chats.forEach(c => {
        html += `
          <div class="chat-item" data-chatid="${c.chat_id}" ${multi ? '' : 'onclick="enterChatRoom(\'' + c.chat_id + '\',\'' + escapeHtml(c.chat_name) + '\', this)" oncontextmenu="showContextMenu(event,\'chat\',\'' + c.chat_id + '\',\'' + escapeHtml(c.chat_name) + '\')"'}>
            ${multi ? '<input type="checkbox" class="multi-cb chat-cb" value="' + c.chat_id + '" onchange="updateRemoveBtn()" />' : ''}
            <div class="avatar avatar-chat">#</div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(c.chat_name)}</div>
            </div>
          </div>
        `;
      });

      html += '</div>';
      list.innerHTML = html;
    }

    function showGroupDetailView(detail) {
      multiSelectMode = false;
      document.getElementById("multiSelectToggle").textContent = '☐ 多选';
      // Update header
      document.getElementById("sidebarTitle").textContent = "📁 " + detail.name;
      document.getElementById("sidebarActions").innerHTML =
        `<button class="back-btn" onclick="backToGroups()">← 返回</button>`;
      document.getElementById("detailToolbar").style.display = "flex";

      // Show group info in right panel
      const container = document.getElementById("msgContainer");
      container.innerHTML = `
        <div class="empty-state">
          <h3>📁 ${escapeHtml(detail.name)}</h3>
          <p>分类: ${detail.category} ${detail.group_type === 'system' ? '· 系统群组' : ''}</p>
          <p>成员: ${detail.members.length} 人 · 聊天室: ${detail.chats.length} 个</p>
          <p style="margin-top:20px;font-size:13px;color:var(--text-muted);">
            点击左侧成员开始私聊 · 点击聊天室进入群聊
          </p>
        </div>
      `;

      document.getElementById("inputBar").style.display = "none";

    function backToGroups() {
      multiSelectMode = false;
      document.getElementById("multiSelectToggle").textContent = '☐ 多选';
      document.querySelectorAll('.group-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.member-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      viewState = "groups";
      selectedGroup = null;
      selectedMember = null;
      selectedChat = null;
      document.getElementById("sidebarTitle").textContent = "📁 我的群组";
      document.getElementById("sidebarActions").innerHTML = `<button onclick="showCreateGroupModal()">+ 新建</button>`;
      document.getElementById("detailToolbar").style.display = "none";
      document.getElementById("chatHeader").textContent = "👥 选择一个群组";
      document.getElementById("inputBar").style.display = "none";

      document.getElementById("msgContainer").innerHTML = `
        <div class="empty-state">
          <h3>📁 群组管理</h3>
          <p>左侧选择群组查看成员和聊天室</p>
          <p style="margin-top:12px;font-size:12px;">
            系统默认创建「即时聊天」和「私聊」群组<br>
            可自行创建和管理自定义群组
          </p>
        </div>
      `;
      loadGroups();

    // ---------- Private Chat (1-on-1) ----------
    let privateChatPeer = null;
    let privateChatPeerName = "";

    async function startPrivateChat(uid, name, el) {
      document.querySelectorAll('.member-item').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
      currentChatRoom = null;
      currentChatRoomName = null;
      privateChatPeer = uid;
      privateChatPeerName = name;
      selectedMember = uid;
      selectedChat = null;
      document.getElementById("chatHeader").innerHTML = '<span>💬 ' + escapeHtml(name) + '</span><button class="detail-btn" onclick="showMemberInfoFromPrivate()">... 详情</button>';
      document.getElementById("textInput").disabled = false;
      document.getElementById("textInput").placeholder = "输入消息...";
      document.getElementById("inputBar").style.display = "flex";
      loadBlacklist();
      loadPrivateMessages();
      if (polling) clearInterval(polling);
      polling = setInterval(loadPrivateMessages, 2000);
    }

    async function loadPrivateMessages() {
      if (!privateChatPeer) return;
      const container = document.getElementById("msgContainer");
      container.innerHTML = '<div class="empty-state"><p>加载中...</p></div>';
      try {
        const msgs = await api("/api/messages?with=" + privateChatPeer);
        const blockedUids = blacklistCache.map(b => b.uid).filter(uid => uid !== currentUid);
        const filtered = msgs.filter(m => !blockedUids.includes(m.sender) && !blockedUids.includes(m.receiver));
        container.innerHTML = filtered.map(m => {
          if (m.msg_type === 'system') {
            return renderSystemMessage(m.content);
          }
          const isMe = m.sender === currentUid;
          const cls = isMe ? "sent" : "received";
          let content = m.revoked
            ? '<div style="font-style:italic;opacity:.6">已撤回</div>'
            : m.msg_type === "image"
              ? '<img src="' + m.file_path + '" style="max-width:200px;max-height:180px;border-radius:12px;">'
              : m.msg_type === "file"
                ? '<a href="' + m.file_path + '" download="' + m.file_name + '">📎 ' + m.file_name + '</a>'
                : escapeHtml(m.content || "");
          const time = new Date(m.timestamp * 1000).toLocaleTimeString("zh-CN",
            { hour: "2-digit", minute: "2-digit" });
          return '<div style="display:flex;align-items:flex-end;margin:4px 0;' + (isMe ? 'flex-direction:row-reverse;' : '') + '">'
            + (!isMe ? '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-right:6px;flex-shrink:0;">' + escapeHtml(privateChatPeerName.charAt(0)) + '</div>' : '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-left:6px;flex-shrink:0;">' + escapeHtml((localStorage.getItem('name')||'').charAt(0)) + '</div>')
            + '<div class="bubble ' + cls + '" style="max-width:70%;">'
            + (!isMe ? '<div class="sender-name" data-uid="' + m.sender + '" data-name="' + escapeHtml(privateChatPeerName) + '" style="cursor:pointer;" onclick="showMemberInfo(this)" oncontextmenu="event.preventDefault();showMemberInfo(this)">' + escapeHtml(privateChatPeerName) + '</div>' : '')
            + '<div>' + content + '</div><div class="time">' + time + '</div></div></div>';
        }).join("");
        if (msgs.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>开始和 ' + escapeHtml(privateChatPeerName) + ' 聊天吧</p></div>';
        }
        container.scrollTop = container.scrollHeight;
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><p>⚠️ ' + escapeHtml(e.message) + '</p></div>';
        if (e.message && (e.message.includes('无权访问') || e.message.includes('登录已过期'))) {
          if (polling) { clearInterval(polling); polling = null; }
        }
      }
    }

    // ---------- Group Chat Room ----------
    let currentChatRoom = null;
    let currentChatRoomName = "";

    async function enterChatRoom(chatId, name, el) {
      document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
      document.querySelectorAll('.member-item').forEach(i => i.classList.remove('active'));
      currentChatRoom = chatId;
      currentChatRoomName = name;
      selectedChat = chatId;
      selectedMember = null;
      document.getElementById("chatHeader").innerHTML = '<span># ' + escapeHtml(name) + '</span><button class="detail-btn" onclick="showChatDetail()">... 详情</button>';
      document.getElementById("textInput").disabled = false;
      document.getElementById("textInput").placeholder = "输入群消息...";
      document.getElementById("inputBar").style.display = "flex";
      loadBlacklist();
      loadGroupMessages();
      if (polling) clearInterval(polling);
      polling = setInterval(loadGroupMessages, 2000);
    }

    async function loadGroupMessages() {
      if (!currentChatRoom) return;
      const container = document.getElementById("msgContainer");
      container.innerHTML = '<div class="empty-state"><p>加载中...</p></div>';
      try {
        const msgs = await api("/api/groups/" + currentChatRoom + "/messages");
        const blockedUids = blacklistCache.map(b => b.uid);
        const filtered = msgs.filter(m => !blockedUids.includes(m.sender));
        // Show announcement banner
        const annMsg = msgs.slice().reverse().find(m => m.msg_type === 'system' && m.content && m.content.includes('📢'));
        const banner = document.getElementById("announcementBanner");
        const dismissedKey = 'dismissed_ann_' + currentChatRoom;
        if (annMsg && localStorage.getItem(dismissedKey) !== annMsg.id.toString()) {
          document.getElementById("announcementBannerText").textContent = annMsg.content.replace(/^📢\s*/, '');
          banner.style.display = 'flex';
          banner.dataset.msgId = annMsg.id;
        } else {
          banner.style.display = 'none';
        }
        const container = document.getElementById("msgContainer");
        container.innerHTML = filtered.map(m => {
          const isMe = m.sender === currentUid;
          if (m.msg_type === 'system') {
            return renderSystemMessage(m.content);
          }
          const cls = isMe ? "sent" : "received";
          let content = m.revoked
            ? '<div style="font-style:italic;opacity:.6">已撤回</div>'
            : m.msg_type === "image"
              ? '<img src="' + m.file_path + '" style="max-width:200px;max-height:180px;border-radius:12px;">'
              : m.msg_type === "file"
                ? '<a href="' + m.file_path + '" download="' + m.file_name + '">📎 ' + m.file_name + '</a>'
                : escapeHtml(m.content || "");
          const time = new Date(m.timestamp * 1000).toLocaleTimeString("zh-CN",
            { hour: "2-digit", minute: "2-digit" });
          return '<div style="display:flex;align-items:flex-end;margin:4px 0;' + (isMe ? 'flex-direction:row-reverse;' : '') + '">'
            + (!isMe && m.sender !== 'system' ? '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-right:6px;flex-shrink:0;">' + escapeHtml((m.sender_name||m.sender).charAt(0)) + '</div>' : (isMe ? '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-left:6px;flex-shrink:0;">' + escapeHtml((localStorage.getItem('name')||'').charAt(0)) + '</div>' : ''))
            + '<div class="bubble ' + cls + '" style="max-width:70%;">'
            + (!isMe && m.sender !== 'system' ? '<div class="sender-name" data-uid="' + m.sender + '" data-name="' + escapeHtml(m.sender_name || m.sender) + '" style="cursor:pointer;" onclick="showMemberInfo(this)" oncontextmenu="event.preventDefault();showMemberInfo(this)">' + escapeHtml(m.sender_name || m.sender) + '</div>' : '')
            + (isMe && m.sender !== 'system' ? '<div class="sender-name" style="text-align:right;">' + escapeHtml(m.sender_name || '我') + '</div>' : '')
            + '<div>' + content + '</div><div class="time">' + time + '</div></div></div>';
        }).join("");
        if (msgs.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>暂无消息，发送第一条吧</p></div>';
        }
        container.scrollTop = container.scrollHeight;
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><p>⚠️ ' + escapeHtml(e.message) + '</p></div>';
        if (e.message && (e.message.includes('无权访问') || e.message.includes('登录已过期'))) {
          if (polling) { clearInterval(polling); polling = null; }
        }
      }
    }

    // ---------- Send message (private or group) ----------
    function sendCurrentMessage() {
      const input = document.getElementById("textInput");
      const text = input.value.trim();
      if (!text) return;

      if (currentChatRoom) {
        // Send group message
        api("/api/groups/" + currentChatRoom + "/send", {
          method: "POST",
          body: JSON.stringify({ content: text })
        }).then(() => {
          input.value = "";
          loadGroupMessages();
        }).catch(e => console.error(e));
      } else if (privateChatPeer) {
        // Send private message
        api("/api/send", {
          method: "POST",
          body: JSON.stringify({ receiver: privateChatPeer, content: text })
        }).then(() => {
          input.value = "";
          loadPrivateMessages();
        }).catch(e => console.error(e));
      }
    }

    // ---------- Load all users ----------
    async function loadAllUsers() {
      try {
        allUsers = await api("/api/users");
      } catch (e) { console.error(e); }
    }

    // ---------- Create Group ----------
    async function showCreateGroupModal() {
      await loadAllUsers();
      const memberList = document.getElementById("newGroupMembers");
      memberList.innerHTML = allUsers.filter(u => u.uid !== currentUid).map(u =>
        '<label><input type="checkbox" value="' + u.uid + '" /> ' + escapeHtml(u.name) + ' (' + u.uid + ')</label>'
      ).join("");

      // 加载可选聊天室
      try {
        const groupChats = await api("/api/groups");
        const chatList = document.getElementById("newGroupChats");
        chatList.innerHTML = groupChats.map(g =>
          '<label><input type="checkbox" data-chatid="' + g.group_id + '" data-name="' + escapeHtml(g.name) + '" /> ' + escapeHtml(g.name) + '</label>'
        ).join("");
        if (groupChats.length === 0) {
          chatList.innerHTML = '<p style="padding:8px;color:var(--text-muted);font-size:13px;">暂无可用聊天室</p>';
        }
      } catch (e) {
        console.error(e);
      }

      document.getElementById("newGroupName").value = "";
      showModal("createGroupModal");
    }

    async function createGroup() {
      const name = document.getElementById("newGroupName").value.trim();
      if (!name) { alert("请输入群组名称"); return; }
      const category = document.getElementById("newGroupCategory").value;
      const memberChecks = document.querySelectorAll("#newGroupMembers input:checked");
      const members = Array.from(memberChecks).map(c => c.value);
      const chatChecks = document.querySelectorAll("#newGroupChats input:checked");
      const chats = Array.from(chatChecks).map(c => ({
        chat_id: c.dataset.chatid,
        chat_name: c.dataset.name
      }));
      try {
        await api("/api/user-groups", {
          method: "POST",
          body: JSON.stringify({ name, category, members, chats })
        });
        closeModal("createGroupModal");
        loadGroups();
      } catch (e) {
        alert(e.message);
      }
    }

    // ---------- Multi-Select Remove ----------
    function toggleMultiSelect() {
      multiSelectMode = !multiSelectMode;
      const btn = document.getElementById("multiSelectToggle");
      btn.textContent = multiSelectMode ? '☑ 完成' : '☐ 多选';
      if (selectedGroup) renderGroupDetail(selectedGroup);
    }

    function updateRemoveBtn() {
      const checked = document.querySelectorAll(".multi-cb:checked");
      const btn = document.getElementById("removeSelectedBtn");
      btn.disabled = checked.length === 0;
    }

    function toggleSelectAllMembers(checked) {
      document.querySelectorAll(".member-cb:not(:disabled)").forEach(cb => cb.checked = checked);
      updateRemoveBtn();
    }

    function toggleSelectAllChats(checked) {
      document.querySelectorAll(".chat-cb").forEach(cb => cb.checked = checked);
      updateRemoveBtn();
    }

    async function removeSelectedItems() {
      if (!selectedGroup) return;
      const memberUids = Array.from(document.querySelectorAll(".member-cb:checked")).map(cb => cb.value);
      const chatIds = Array.from(document.querySelectorAll(".chat-cb:checked")).map(cb => cb.value);
      if (memberUids.length === 0 && chatIds.length === 0) return;
      try {
        await api("/api/user-groups/" + selectedGroup.group_id + "/batch-remove", {
          method: "POST",
          body: JSON.stringify({ member_uids: memberUids, chat_ids: chatIds })
        });
        multiSelectMode = false;
        document.getElementById("multiSelectToggle").textContent = '☐ 多选';
        enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    // ---------- Unified Add Chat (members + chat rooms) ----------
    async function showAddItemModal() {
      if (!selectedGroup) return;
      const list = document.getElementById("addItemList");
      const existingMemberUids = selectedGroup.members.map(m => m.uid);
      const existingChatIds = selectedGroup.chats.map(c => c.chat_id);

      // Fetch friends (available members)
      let friendsHtml = '';
      try {
        const friends = await api("/api/friends");
        const availableFriends = friends.filter(f => !existingMemberUids.includes(f.uid));
        friendsHtml = availableFriends.map(f =>
          '<label><input type="checkbox" class="add-member-cb" value="' + f.uid + '" /> ' + escapeHtml(f.name) + ' (' + f.uid + ')</label>'
        ).join("");
        if (availableFriends.length === 0) friendsHtml = '<p style="padding:6px;color:var(--text-muted);font-size:13px;">没有可选的联系人</p>';
      } catch (e) { friendsHtml = '<p style="padding:6px;color:var(--text-muted);font-size:13px;">加载失败</p>'; }

      // Fetch available chat rooms
      let chatsHtml = '';
      try {
        const groupChats = await api("/api/groups");
        const availableChats = groupChats.filter(g => !existingChatIds.includes(g.group_id));
        chatsHtml = availableChats.map(g =>
          '<label><input type="checkbox" class="add-chat-cb" data-chatid="' + g.group_id + '" data-name="' + escapeHtml(g.name) + '" /> ' + escapeHtml(g.name) + '</label>'
        ).join("");
        if (availableChats.length === 0) chatsHtml = '<p style="padding:6px;color:var(--text-muted);font-size:13px;">没有可添加的聊天室</p>';
      } catch (e) { chatsHtml = '<p style="padding:6px;color:var(--text-muted);font-size:13px;">加载失败</p>'; }

      list.innerHTML = '<div class="add-section-title">👤 联系人</div>' + friendsHtml
        + '<div class="add-section-title" style="margin-top:8px;">💬 聊天室</div>' + chatsHtml;
      showModal("addItemModal");
    }

    async function addItemsToGroup() {
      if (!selectedGroup) return;
      const memberChecks = document.querySelectorAll(".add-member-cb:checked");
      const uids = Array.from(memberChecks).map(c => c.value);
      const chatChecks = document.querySelectorAll(".add-chat-cb:checked");
      const chats = Array.from(chatChecks).map(c => ({ chat_id: c.dataset.chatid, chat_name: c.dataset.name }));
      if (uids.length === 0 && chats.length === 0) { alert("请选择要添加的项目"); return; }
      try {
        if (uids.length > 0) {
          await api("/api/user-groups/" + selectedGroup.group_id + "/members", {
            method: "POST", body: JSON.stringify({ uids })
          });
        }
        for (const chat of chats) {
          await api("/api/user-groups/" + selectedGroup.group_id + "/chats", {
            method: "POST", body: JSON.stringify({ chat_id: chat.chat_id, chat_name: chat.chat_name })
          });
        }
        closeModal("addItemModal");
        enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    // ---------- Create Chat Room in Group ----------
    async function showCreateChatModal() {
      if (!selectedGroup) return;
      await loadAllUsers();
      const memberList = document.getElementById("newChatMembers");
      memberList.innerHTML = allUsers.filter(u => u.uid !== currentUid).map(u =>
        '<label><input type="checkbox" value="' + u.uid + '" /> ' + escapeHtml(u.name) + ' (' + u.uid + ')</label>'
      ).join("");
      document.getElementById("newChatName").value = "";
      showModal("createChatModal");
    }

    async function createChatInGroup() {
      if (!selectedGroup) return;
      const name = document.getElementById("newChatName").value.trim();
      if (!name) { alert("请输入聊天室名称"); return; }
      const memberChecks = document.querySelectorAll("#newChatMembers input:checked");
      const members = Array.from(memberChecks).map(c => c.value);
      try {
        await api("/api/user-groups/" + selectedGroup.group_id + "/create-chat", {
          method: "POST",
          body: JSON.stringify({ name, members })
        });
        closeModal("createChatModal");
        enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    // ---------- Chat Room Detail ----------
    let chatDetailData = null; // stores the latest chat detail data

    async function showChatDetail() {
      if (!currentChatRoom) return;
      try {
        const detail = await api("/api/groups/" + currentChatRoom + "/detail");
        chatDetailData = detail;
        document.getElementById("chatDetailName").textContent = detail.name;
        document.getElementById("chatDetailMeta").textContent = detail.members.length + " 位成员 · 创建者: " + (detail.members.find(m => m.role === 'admin')?.name || detail.creator);
        
        // Show admin actions for admin/manager
        const myRole = detail.members.find(m => m.uid === currentUid)?.role;
        const isAdmin = myRole === 'admin' || myRole === 'manager';
        document.getElementById("chatDetailAdminActions").style.display = isAdmin ? 'inline' : 'none';
        // Dissolve button only for admin (群主)
        document.getElementById("dissolveChatBtn").style.display = myRole === 'admin' ? 'inline-block' : 'none';

        const memberList = document.getElementById("chatDetailMembers");
        memberList.innerHTML = detail.members.map(m => {
          const isMe = m.uid === currentUid;
          let roleLabel = '';
          if (m.role === 'admin') roleLabel = ' 🔑群主';
          else if (m.role === 'manager') roleLabel = ' 🛡️管理员';
          var _uid = m.uid, _name = m.name, _role = m.role;
                              const roleActions = (!isMe && myRole === 'admin') 
            ? '<span data-uid="' + _uid + '" data-name="' + _name + '" style="font-size:11px;margin-left:4px;color:var(--danger);cursor:pointer;" onclick="kickFromChat(this)">踢出</span>'
              + (m.role !== 'manager' 
                ? '<span data-uid="' + _uid + '" data-name="' + _name + '" style="font-size:11px;margin-left:4px;color:var(--primary);cursor:pointer;" onclick="manageAdmin(this)">设为管理</span>'
                : '<span style="font-size:11px;margin-left:4px;color:var(--text-muted);cursor:pointer;" onclick="manageAdmin(this,\'unset\')">取消管理</span>')
            : '';
          return '<div data-uid="' + _uid + '" data-name="' + _name + '" data-role="' + _role + '" style="display:flex;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer;" onclick="showMemberInfo(this)">' +
            '<div class="avatar avatar-user" style="width:32px;height:32px;font-size:13px;">' + escapeHtml(m.name.charAt(0)) + '</div>' +
            '<div style="flex:1;margin-left:8px;">' +
              '<span style="font-weight:500;font-size:13px;">' + escapeHtml(m.name) + roleLabel + '</span>' +
              (isMe ? ' <span style="font-size:11px;color:var(--text-muted);">(我)</span>' : '') +
              roleActions +
            '</div>' +
          '</div>';
        }).join("");
        showModal("chatDetailModal");
      } catch (e) { alert(e.message); }
    }

    async function leaveChatRoom() {
      if (!currentChatRoom) return;
      if (!confirm("是否确认退出聊天室？")) return;
      try {
        await api("/api/groups/" + currentChatRoom + "/leave", { method: "POST" });
        closeModal("chatDetailModal");
        currentChatRoom = null;
        currentChatRoomName = "";
        if (selectedGroup) enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    function dismissAnnouncement() {
      if (currentChatRoom) {
        const banner = document.getElementById("announcementBanner");
        localStorage.setItem('dismissed_ann_' + currentChatRoom, banner.dataset.msgId || '1');
        banner.style.display = 'none';
      }
    }

    async function dissolveChatRoom() {
      if (!currentChatRoom) return;
      if (!confirm("确定解散此聊天室？所有成员将被移除，消息保留。")) return;
      try {
        await api("/api/groups/" + currentChatRoom + "/dissolve", { method: "POST" });
        closeModal("chatDetailModal");
        currentChatRoom = null;
        currentChatRoomName = "";
        if (selectedGroup) enterGroup(selectedGroup.group_id);
        alert("聊天室已解散");
      } catch (e) { alert(e.message); }
    }

    // Invite to chat room
    async function showInviteToChat() {
      if (!currentChatRoom) return;
      await loadAllUsers();
      const currentMemberUids = chatDetailData ? chatDetailData.members.map(m => m.uid) : [];
      const available = allUsers.filter(u => !currentMemberUids.includes(u.uid));
      const list = document.getElementById("inviteChatMemberList");
      list.innerHTML = available.map(u =>
        '<label><input type="checkbox" value="' + u.uid + '" /> ' + escapeHtml(u.name) + ' (' + u.uid + ')</label>'
      ).join("");
      if (available.length === 0) {
        list.innerHTML = '<p style="padding:12px;color:var(--text-muted)">所有用户已在聊天室中</p>';
      }
      showModal("inviteChatModal");
    }

    async function inviteToChat() {
      if (!currentChatRoom) return;
      const checks = document.querySelectorAll("#inviteChatMemberList input:checked");
      const uids = Array.from(checks).map(c => c.value);
      if (uids.length === 0) { alert("请选择成员"); return; }
      try {
        await api("/api/groups/" + currentChatRoom + "/invite", {
          method: "POST",
          body: JSON.stringify({ members: uids })
        });
        closeModal("inviteChatModal");
        showChatDetail();
        loadGroupMessages();
      } catch (e) { alert(e.message); }
    }

    // Rename chat room
    async function showRenameChat() {
      if (!currentChatRoom) return;
      document.getElementById("renameChatInput").value = chatDetailData?.name || '';
      showModal("renameChatModal");
    }

    async function renameChat() {
      if (!currentChatRoom) return;
      const name = document.getElementById("renameChatInput").value.trim();
      if (!name) { alert("名称不能为空"); return; }
      try {
        await api("/api/groups/" + currentChatRoom + "/rename", {
          method: "PUT",
          body: JSON.stringify({ name })
        });
        closeModal("renameChatModal");
        showChatDetail();
        // Update header
        document.getElementById("chatHeader").innerHTML = '<span># ' + escapeHtml(name) + '</span><button class="detail-btn" onclick="showChatDetail()">... 详情</button>';
      } catch (e) { alert(e.message); }
    }

    // Announcement
    async function showPostAnnouncement() {
      document.getElementById("announcementInput").value = '';
      showModal("announcementModal");
    }

    async function postAnnouncement() {
      if (!currentChatRoom) return;
      const content = document.getElementById("announcementInput").value.trim();
      if (!content) { alert("公告内容不能为空"); return; }
      try {
        await api("/api/groups/" + currentChatRoom + "/announcement", {
          method: "POST",
          body: JSON.stringify({ content })
        });
        closeModal("announcementModal");
        loadGroupMessages();
      } catch (e) { alert(e.message); }
    }

    // Kick from chat room
    async function kickFromChat(el) {
      if (!currentChatRoom) return;
      const uid = el.dataset ? el.dataset.uid : el;
      const name = el.dataset ? (el.dataset.name || '') : '';
      if (!uid) return;
      if (!confirm("确认将 " + name + " 移出聊天室？")) return;
      try {
        await api("/api/groups/" + currentChatRoom + "/kick", {
          method: "POST",
          body: JSON.stringify({ uid })
        });
        showChatDetail();
        loadGroupMessages();
      } catch (e) { alert(e.message); }
    }

    // Manage admin
    async function manageAdmin(el, action) {
      if (!currentChatRoom) return;
      const uid = el.dataset ? el.dataset.uid : el;
      const name = el.dataset ? (el.dataset.name || '') : '';
      if (!uid) return;
      action = action || 'set';
      const msg = action === 'set' ? "确认将 " + name + " 设为管理员？" : "确认取消 " + name + " 的管理员权限？";
      if (!confirm(msg)) return;
      try {
        await api("/api/groups/" + currentChatRoom + "/admin", {
          method: "POST",
          body: JSON.stringify({ uid, action })
        });
        showChatDetail();
      } catch (e) { alert(e.message); }
    }

    // ---------- Member Info Panel ----------
    let memberInfoTarget = null; // {uid, name, role, fromChat: bool}

    async function showMemberInfo(el) {
      const uid = el.dataset ? el.dataset.uid : el;
      const name = el.dataset ? (el.dataset.name || '') : '';
      const role = el.dataset ? (el.dataset.role || '') : '';
      memberInfoTarget = { uid, name, role: role || '', fromChat: false };
      document.getElementById("memberInfoAvatar").textContent = name.charAt(0);
      document.getElementById("memberInfoName").textContent = name;
      document.getElementById("memberInfoUid").textContent = uid;
      const roleMap = { 'student': '学生', 'teacher': '教师', 'manager': '管理员' };
      document.getElementById("memberInfoRole").textContent = roleMap[role] || role || '';
      
      // Load description and check block status
      try {
        const userData = await api("/api/user/" + uid);
        document.getElementById("memberInfoDesc").textContent = userData.description || '暂无简介';
      } catch (e) {
        document.getElementById("memberInfoDesc").textContent = '暂无简介';
      }
      updateBlockBtn();
      updateFriendBtn();

      showModal("memberInfoModal");
    }

    async function showMemberInfoFromPrivate() {
      if (!privateChatPeer) return;
      // Create a synthetic element with the peer's data
      const el = { dataset: { uid: privateChatPeer, name: privateChatPeerName, role: '' } };
      showMemberInfo(el);
    }

    async function memberInfoStartChat() {
      if (!memberInfoTarget) return;
      const uid = memberInfoTarget.uid;
      const name = memberInfoTarget.name;
      openPopupChat(uid, name);
    }

    // ---------- Popup Private Chat ----------
    let popupChatPeer = null;
    let popupChatPeerName = "";
    let popupPolling = null;

    async function openPopupChat(uid, name) {
      popupChatPeer = uid;
      popupChatPeerName = name;
      document.getElementById("popupChatTitle").textContent = '💬 ' + name;
      document.getElementById("popupChatInput").value = "";
      document.getElementById("popupChatMessages").innerHTML = '<div class="empty-state"><p>加载中...</p></div>';
      showModal("popupChatModal");
      closeModal("memberInfoModal");
      loadPopupChatMessages();
      if (popupPolling) clearInterval(popupPolling);
      popupPolling = setInterval(loadPopupChatMessages, 2000);
    }

    function closePopupChat() {
      if (popupPolling) { clearInterval(popupPolling); popupPolling = null; }
      popupChatPeer = null;
      popupChatPeerName = "";
      closeModal("popupChatModal");
    }

    async function loadPopupChatMessages() {
      if (!popupChatPeer) return;
      try {
        const msgs = await api("/api/messages?with=" + popupChatPeer);
        const container = document.getElementById("popupChatMessages");
        const blockedUids = blacklistCache.map(b => b.uid);
        const filtered = msgs.filter(m => !blockedUids.includes(m.sender) && !blockedUids.includes(m.receiver));
        container.innerHTML = filtered.map(m => {
          if (m.msg_type === 'system') return renderSystemMessage(m.content);
          const isMe = m.sender === currentUid;
          const cls = isMe ? "sent" : "received";
          let content = m.revoked
            ? '<div style="font-style:italic;opacity:.6">已撤回</div>'
            : m.msg_type === "image" ? '<img src="' + m.file_path + '" style="max-width:200px;max-height:180px;border-radius:12px;">'
            : m.msg_type === "file" ? '<a href="' + m.file_path + '" download="' + m.file_name + '">📎 ' + m.file_name + '</a>'
            : escapeHtml(m.content || "");
          const time = new Date(m.timestamp * 1000).toLocaleTimeString("zh-CN",
            { hour: "2-digit", minute: "2-digit" });
          return '<div style="display:flex;align-items:flex-end;margin:4px 0;' + (isMe ? 'flex-direction:row-reverse;' : '') + '">'
            + (!isMe ? '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-right:6px;flex-shrink:0;">' + escapeHtml(popupChatPeerName.charAt(0)) + '</div>' : '<div class="avatar" style="width:28px;height:28px;font-size:12px;margin-left:6px;flex-shrink:0;">' + escapeHtml((localStorage.getItem('name')||'').charAt(0)) + '</div>')
            + '<div class="bubble ' + cls + '" style="max-width:70%;">'
            + (!isMe ? '<div class="sender-name">' + escapeHtml(popupChatPeerName) + '</div>' : '')
            + '<div>' + content + '</div><div class="time">' + time + '</div></div></div>';
        }).join("");
        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>开始和 ' + escapeHtml(popupChatPeerName) + ' 聊天吧</p></div>';
        }
        container.scrollTop = container.scrollHeight;
      } catch (e) {
        console.error("loadPopupChatMessages:", e);
        container.innerHTML = '<div class="empty-state"><p>⚠️ ' + escapeHtml(e.message) + '</p></div>';
      }
    }

    async function sendPopupChatMsg() {
      const input = document.getElementById("popupChatInput");
      const text = input.value.trim();
      if (!text || !popupChatPeer) return;
      try {
        await api("/api/send", {
          method: "POST",
          body: JSON.stringify({ receiver: popupChatPeer, content: text })
        });
        input.value = "";
        loadPopupChatMessages();
      } catch (e) { alert(e.message); }
    }
    
    // ---- Shared helpers ----
    function renderSystemMessage(content) {
      return '<div style="text-align:center;font-size:12px;color:var(--text-muted);padding:4px 0;">' + escapeHtml(content || "") + '</div>';
    }

    let blacklistCache = [];

    async function loadBlacklist() {
      try {
        blacklistCache = await api("/api/blacklist");
      } catch (e) { blacklistCache = []; }
    }

    async function updateBlockBtn() {
      if (!memberInfoTarget) return;
      const isBlocked = blacklistCache.some(b => b.uid === memberInfoTarget.uid);
      const btn = document.getElementById("memberInfoBlockBtn");
      if (isBlocked) {
        btn.textContent = '取消拉黑';
        btn.style.color = 'var(--text-muted)';
        btn.style.borderColor = 'var(--border)';
      } else {
        btn.textContent = '拉黑';
        btn.style.color = 'var(--danger)';
        btn.style.borderColor = 'var(--danger)';
      }
    }

    async function memberInfoToggleBlock() {
      if (!memberInfoTarget) return;
      const isBlocked = blacklistCache.some(b => b.uid === memberInfoTarget.uid);
      try {
        if (isBlocked) {
          await api("/api/blacklist/remove", { method: "POST", body: JSON.stringify({ uid: memberInfoTarget.uid }) });
        } else {
          await api("/api/blacklist/add", { method: "POST", body: JSON.stringify({ uid: memberInfoTarget.uid }) });
        }
        await loadBlacklist();
        updateBlockBtn();
      } catch (e) { alert(e.message); }
    }

    async function updateFriendBtn() {
      const btn = document.getElementById("memberInfoFriendBtn");
      if (!memberInfoTarget || memberInfoTarget.uid === currentUid) {
        btn.style.display = 'none';
        return;
      }
      try {
        const friends = await api("/api/friends");
        const isFriend = friends.some(f => f.uid === memberInfoTarget.uid);
        if (isFriend) {
          btn.textContent = '❤️ 好友';
          btn.style.color = 'var(--primary)';
          btn.style.borderColor = 'var(--primary)';
          btn.onclick = () => memberInfoRemoveFriend();
        } else {
          btn.textContent = '🤍 加好友';
          btn.style.color = 'var(--primary)';
          btn.style.borderColor = 'var(--primary)';
          btn.onclick = () => { showFriendRequestModal(memberInfoTarget.uid, memberInfoTarget.name); };
        }
        btn.style.display = 'inline-block';
      } catch (e) {
        btn.style.display = 'none';
      }
    }

    async function memberInfoRemoveFriend() {
      if (!memberInfoTarget) return;
      try {
        await api("/api/friends/remove", { method: "POST", body: JSON.stringify({ uid: memberInfoTarget.uid }) });
        updateFriendBtn();
      } catch (e) { alert(e.message); }
    }

    // ---------- Context Menu (Right-click) ----------
    // Handled via contextmenu event on message sender names and member items

    // ---------- Friend Request ----------
    let friendReqTargetUid = null;
    function showFriendRequestModal(uid, name) {
      friendReqTargetUid = uid;
      document.getElementById("friendReqTargetName").textContent = name;
      document.getElementById("friendReqMessage").value = "";
      showModal("friendRequestModal");
    }
    async function sendFriendRequest() {
      if (!friendReqTargetUid) return;
      const message = document.getElementById("friendReqMessage").value.trim();
      try {
        await api("/api/friend-request", {
          method: "POST",
          body: JSON.stringify({ to_uid: friendReqTargetUid, message })
        });
        closeModal("friendRequestModal");
        alert("好友申请已发送");
      } catch (e) { alert(e.message); }
    }

    // ---------- Friend Management (for system groups) ----------
    async function toggleFriend(uid, name) {
      try {
        const friends = await api("/api/friends");
        const isFriend = friends.some(f => f.uid === uid);
        if (isFriend) {
          await api("/api/friends/remove", { method: "POST", body: JSON.stringify({ uid }) });
        } else {
          await api("/api/friends/add", { method: "POST", body: JSON.stringify({ uid }) });
        }
        // Refresh group detail if in one
        if (selectedGroup) enterGroup(selectedGroup.group_id);
      } catch (e) { alert(e.message); }
    }

    // ---------- Init ----------
    window.onload = function() {
      if (!localStorage.getItem("token")) { location.href = "/"; return; }
      loadGroups();
      loadBlacklist();
    };
  </script>
</body>
</html>
