<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .nav {
        width: 220px;
        background: var(--card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 24px 12px;
      }
      .nav h2 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 24px;
      }
      .nav a {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-radius: 12px;
        color: #1e293b;
        text-decoration: none;
        font-weight: 500;
        margin: 4px 0;
        transition: 0.2s;
        position: relative;
      }
      .nav a:hover,
      .nav a.active {
        background: #e0e7ff;
        color: var(--primary);
      }
      .nav a.active {
        background: var(--primary);
        color: white;
      }
      .nav a .badge-dot {
        display: none;
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        margin-left: 6px;
        flex-shrink: 0;
      }
      .nav a .badge-dot.show { display: inline-block; }
      .logout {
        background: transparent;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
        margin-top: auto;
        font-weight: 500;
      }
      iframe {
        flex: 1;
        border: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <h2>🎓 校园通</h2>
      <a href="/groups" target="contentFrame" onclick="setActive(this)"
        >👥 聊天</a
      >
      <a href="/query" target="contentFrame" onclick="setActive(this)"
        >🔍 校园查询</a
      >
      <a href="/notifications" target="contentFrame" onclick="setActive(this)"
        >🔔 通知<span class="badge-dot" id="notifBadge"></span></a
      >
      <a href="/profile" target="contentFrame" onclick="setActive(this)"
        >👤 个人设置</a
      >
      <button class="logout" onclick="logout()">🚪 退出登录</button>
    </div>
    <iframe name="contentFrame" src="/groups"></iframe>
    <script>
      function setActive(el) {
        document
          .querySelectorAll(".nav a")
          .forEach((a) => a.classList.remove("active"));
        el.classList.add("active");
      }
      function logout() {
        fetch("/api/logout", {
          method: "POST",
          headers: { Authorization: sessionStorage.getItem("token") },
        }).finally(() => {
          sessionStorage.clear();
          location.href = "/";
        });
      }
      window.onload = function () {
        if (!sessionStorage.getItem("token")) location.href = "/";
      };
      async function checkUnread() {
        try {
          const token = sessionStorage.getItem("token");
          if (!token) return;
          const res = await fetch("/api/notifications/unread-count", {
            headers: { Authorization: token }
          });
          const data = await res.json();
          const badge = document.getElementById("notifBadge");
          if (!badge) return;
          if (data.count > 0) {
            badge.classList.add("show");
          } else {
            badge.classList.remove("show");
          }
        } catch (e) {}
      }
      setInterval(checkUnread, 10000);
      setTimeout(checkUnread, 1000);
    </script>
  </body>
</html>
