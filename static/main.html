<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .nav {
        width: 220px;
        background: var(--card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 24px 12px;
      }
      .nav h2 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 24px;
      }
      .nav a {
        display: block;
        padding: 12px 16px;
        border-radius: 12px;
        color: #1e293b;
        text-decoration: none;
        font-weight: 500;
        margin: 4px 0;
        transition: 0.2s;
      }
      .nav a:hover,
      .nav a.active {
        background: #e0e7ff;
        color: var(--primary);
      }
      .nav a.active {
        background: var(--primary);
        color: white;
      }
      .logout {
        background: transparent;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
        margin-top: auto;
        font-weight: 500;
      }
      iframe {
        flex: 1;
        border: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <h2>🎓 校园通</h2>
      <!--
      <a
        href="/chat"
        target="contentFrame"
        onclick="setActive(this)"
        class="active"
        >💬 聊天</a
      >
    -->
      <a href="/groups" target="contentFrame" onclick="setActive(this)"
        >👥 聊天</a
      >
      <!--
      <a href="/announcements" target="contentFrame" onclick="setActive(this)"
        >📢 公告</a
      >
       -->
      <a href="/query" target="contentFrame" onclick="setActive(this)"
        >🔍 校园查询</a
      >

      <a href="/notifications" target="contentFrame" onclick="setActive(this)"
        >🔔 通知</a
      >
      <a href="/profile" target="contentFrame" onclick="setActive(this)"
        >👤 个人设置</a
      >
      <button class="logout" onclick="logout()">🚪 退出登录</button>
    </div>
    <iframe name="contentFrame" src="/groups"></iframe>
    <script>
      function setActive(el) {
        document
          .querySelectorAll(".nav a")
          .forEach((a) => a.classList.remove("active"));
        el.classList.add("active");
      }
      function logout() {
        fetch("/api/logout", {
          method: "POST",
          headers: { Authorization: localStorage.getItem("token") },
        }).finally(() => {
          localStorage.clear();
          location.href = "/";
        });
      }
      window.onload = function () {
        if (!localStorage.getItem("token")) location.href = "/";
      };
    </script>
  </body>
</html>
