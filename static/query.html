<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>校园查询 - 校园通</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .nav {
        padding: 12px 30px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .nav button {
        padding: 8px 18px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: white;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s;
      }
      .nav button.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px 30px;
      }
      .timeline {
        position: relative;
        margin: 20px 0;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .timeline-item {
        position: relative;
        padding-left: 40px;
        margin-bottom: 20px;
      }
      .timeline-item::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 12px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--primary);
        border: 3px solid white;
        box-shadow: 0 0 0 2px var(--primary);
      }
      .timeline-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      }
      .timeline-card h4 {
        margin-bottom: 4px;
      }
      .timeline-card .info {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .query-form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .query-form input,
      .query-form select {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .btn {
        padding: 8px 20px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="nav" id="navBar"></div>
    <div class="content" id="queryContent"></div>
    <script>
      let token = localStorage.getItem("token");
      async function api(url, opt = {}) {
        const headers = { ...opt.headers };
        if (token) headers["Authorization"] = token;
        if (!(opt.body instanceof FormData))
          headers["Content-Type"] = "application/json";
        const res = await fetch(url, { ...opt, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        return data;
      }
      const queries = [
        {
          key: "userSearch",
          label: "🔎 用户搜索",
          form: '<input id="kw" placeholder="学号/姓名"><button class="btn" onclick="searchUsers()">搜索</button>',
        },
        /*{
          key: "freeRoom",
          label: "🏫 空闲教室",
          form: '<input type="date" id="rdate"><input type="time" id="rstart" value="08:00"><input type="time" id="rend" value="10:00"><button class="btn" onclick="freeRooms()">查询</button>',
        },*/
        { key: "events", label: "🎉 赛事活动", form: "" },
        {
          key: "tutor",
          label: "👩‍🏫 辅导值班",
          form: '<input type="date" id="tdate"><input id="tcollege" placeholder="学院"><button class="btn" onclick="tutorDuty()">查询</button>',
        },
        {
          key: "office",
          label: "📍 办公室",
          form: '<input id="ocollege" placeholder="学院"><button class="btn" onclick="teacherOffice()">查询</button>',
        },
        {
          key: "course",
          label: "📅 课程安排",
          form: '<input id="croom" placeholder="教室编号"><button class="btn" onclick="loadCourses()">查询</button>',
        },
        {
          key: "announcements",
          label: "📢 公告",
          form: '<input id="croom" placeholder="教室编号"><button class="btn" onclick="loadCourses()">查询</button>',
        },
      ];
      function switchQuery(key) {
        document
          .querySelectorAll("#navBar button")
          .forEach((b) => b.classList.remove("active"));
        document.querySelector(`[data-key="${key}"]`).classList.add("active");
        const q = queries.find((x) => x.key === key);
        document.getElementById("queryContent").innerHTML =
          `<div class="query-form">${q.form}</div><div id="res"></div>`;
        if (key === "events") loadEvents();
        if (key === "course") loadCourses();
      }
      function renderTimeline(items, mapper) {
        const container = document.getElementById("res");
        container.innerHTML = items.length
          ? `<div class="timeline">${items.map((item, i) => `<div class="timeline-item"><div class="timeline-card">${mapper(item)}</div></div>`).join("")}</div>`
          : '<div style="text-align:center;color:#64748b;padding:40px;">暂无数据</div>';
      }
      async function searchUsers() {
        const kw = document.getElementById("kw").value.trim();
        if (!kw) return;
        const users = await api(`/api/search/users?q=${kw}`);
        renderTimeline(
          users,
          (u) =>
            `<h4>${u.name} (${u.uid})</h4><div class="info">角色：${u.role === "student" ? "学生" : "教师"}</div>`,
        );
      }
      async function freeRooms() {
        const date = document.getElementById("rdate").value,
          start = document.getElementById("rstart").value,
          end = document.getElementById("rend").value;
        const rooms = await api(
          `/api/classrooms/free?date=${date}&start=${start}&end=${end}`,
        );
        renderTimeline(
          rooms,
          (r) =>
            `<h4>${r.id} - ${r.building} ${r.floor}层</h4><div class="info">座位：${r.seats} · 多媒体：${r.media}</div>`,
        );
      }
      async function loadEvents() {
        const events = await api("/api/events");
        renderTimeline(
          events,
          (e) =>
            `<h4>${e.name} (${e.type})</h4><div class="info">🕒 ${e.start_time} ~ ${e.end_time}</div><div class="info">📍 ${e.location} · 👥 ${e.target}</div><div>${e.description}</div>`,
        );
      }
      async function tutorDuty() {
        const date = document.getElementById("tdate").value,
          college = document.getElementById("tcollege").value.trim();
        const duties = await api(
          `/api/tutor_duty?date=${date}&college=${college}`,
        );
        renderTimeline(
          duties,
          (d) =>
            `<h4>${d.teacher_name} (${d.teacher_uid})</h4><div class="info">🏫 ${d.college} · ${d.start_time}-${d.end_time}</div><div class="info">📍 ${d.location} · 📞 ${d.contact}</div>`,
        );
      }
      async function teacherOffice() {
        const college = document.getElementById("ocollege").value.trim();
        const offices = await api(`/api/teacher_office?college=${college}`);
        renderTimeline(
          offices,
          (o) =>
            `<h4>${o.name} (${o.uid})</h4><div class="info">${o.title} · ${o.college}</div><div class="info">📍 ${o.office} · 📞 ${o.phone}</div>`,
        );
      }
      async function loadCourses() {
        const room = document.getElementById("croom")?.value.trim() || "";
        const courses = await api(`/api/course_schedule?classroom=${room}`);
        renderTimeline(
          courses,
          (c) =>
            `<h4>${c.course_name}</h4><div class="info">👨‍🏫 ${c.teacher} · ${c.start_time}-${c.end_time} (周${c.day_of_week})</div><div class="info">教室：${c.classroom}</div>`,
        );
      }
      window.onload = function () {
        if (!localStorage.getItem("token")) {
          location.href = "/";
          return;
        }
        document.getElementById("navBar").innerHTML = queries
          .map(
            (q) =>
              `<button data-key="${q.key}" onclick="switchQuery('${q.key}')">${q.label}</button>`,
          )
          .join("");
        switchQuery("userSearch");
      };
    </script>
  </body>
</html>
